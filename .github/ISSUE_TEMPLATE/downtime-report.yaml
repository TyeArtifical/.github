name: Downtime Report
description: Report downtime or bot connectivity issues for Tye.
title: "[DOWN] "
labels: ["discord", "downtime", "possible: Railway"]
assignees: []
body:
  - type: checkboxes
    id: railway_status
    attributes:
      label: "Step 1: Check Railway Status (especially EU West)"
      options:
        - label: "Railway is fully up"
        - label: "Some parts of Railway are down"
        - label: "Railway EU West is down"
    validations:
      required: true

  - type: input
    id: railway_time
    attributes:
      label: "If Railway is down, provide the current date and time (DD/MM/YYYY HH:MM, e.g., 23/12/2026 21:12)"
      placeholder: "23/12/2026 21:12"

  - type: checkboxes
    id: bot_status
    attributes:
      label: "Step 2: Bot Status on Discord"
      options:
        - label: "The bot is online"
        - label: "The bot is offline"
        - label: "Other"
    validations:
      required: true

  - type: textarea
    id: bot_status_other
    attributes:
      label: "If 'Other', explain the bot status"
      placeholder: "Describe the issue here"

  - type: checkboxes
    id: issues_experienced
    attributes:
      label: "Step 3: Describe issues (if Railway is up)"
      options:
        - label: "I keep getting an error message when sending a message to the bot"
        - label: "The bot says I am not subscribed"
        - label: "The bot isn’t responding with anything"
        - label: "Other (please elaborate below)"

  - type: textarea
    id: issues_other_details
    attributes:
      label: "Additional details for 'Other' issues"
      placeholder: "Insert details here"
